<div class="card">
    <div class="card-content">
      <div class="card-header">
        <h5 class="card-title">Form {{(user.id > 0) ? 'Update' :  'Create'}} User</h5>
      </div>
      <div class="card-body">
          <form (ngSubmit)="onSubmit(userForm)" #userForm="ngForm">
              <div>
                  <input type="text"  
                      class="form-control my-2"
                      placeholder="Name"
                      name="name"
                      [(ngModel)]="user.name"
                      #name="ngModel"
                      /> 
                    @if (errors?.name) {
                        <div class="text-danger"> {{errors.name}} </div>
                    }
              </div>
              <div>
                  <input type="text"  
                  class="form-control my-2"
                  placeholder="Lastname"
                  name="lastname"
                  [(ngModel)]="user.lastname"
                  #lastname="ngModel"
                  /> 
                   @if (errors?.lastname) {
                        <div class="text-danger"> {{errors.lastname}} </div>
                    }
              </div>
              <div>
                  <input type="email"  
                      class="form-control my-2"
                      placeholder="Email"
                      name="email"
                      [(ngModel)]="user.email"
                      #email="ngModel"
                      />  
                       @if (errors?.email) {
                        <div class="text-danger"> {{errors.email}} </div>
                    }
              </div>
              <div>
                  <input type="text"  
                      class="form-control my-2"
                      placeholder="Username"
                      name="username"
                      [(ngModel)]="user.username"
                      #username="ngModel"
                      /> 
                       @if (errors?.username) {
                        <div class="text-danger"> {{errors.username}} </div>
                    }
              </div>
              <div>
                  <input type="password"  
                      class="form-control my-2"
                      placeholder="Password"
                      name="password"
                      [(ngModel)]="user.password"
                      #password="ngModel"
                      /> 
                       @if (errors?.password) {
                        <div class="text-danger"> {{errors.password}} </div>
                    }
              </div>
              <div>
                  <button type="submit" class="btn btn-primary my-2" >
                      {{(user.id > 0) ? 'Update' :  'Create'}}
                  </button>
                  <button type="button" class="btn btn-secondary m-2" (click)="onClear(userForm)">Clear</button>
              </div>
          </form>
      </div>
    </div>
</div>
